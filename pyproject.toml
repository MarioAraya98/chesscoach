[project]
name = "chesscoach"
version = "0.1.0"
description = "Panel de progreso de ajedrez para mariocr98 / MarioCR1998"
requires-python = ">=3.11"
dependencies = [
    "chess>=1.11.1",
    "httpx>=0.27",
    "streamlit>=1.38",
    "pandas>=2.2",
    "altair>=5.4",
    "pyyaml>=6.0",
]

[project.scripts]
chesscoach = "chesscoach.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chesscoach"]
